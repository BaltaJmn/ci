name: iOS TestFlight release

# Archives the iOS app, signs it with the team's own certificates and uploads it to App Store
# Connect, which hands it to TestFlight. Called from each app's release-ios.yml.
on:
  workflow_call:
    inputs:
      project:
        type: string
        default: iosApp/iosApp.xcodeproj
      scheme:
        type: string
        default: iosApp
      version-file:
        description: File with the Android versionName and versionCode, reused as the iOS version and build
        type: string
        default: androidApp/build.gradle.kts
      java-version:
        type: string
        default: '17'
    secrets:
      APPSTORE_KEY_ID:
        required: true
      APPSTORE_ISSUER_ID:
        required: true
      APPSTORE_PRIVATE_KEY:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_DEVELOPMENT_P12:
        required: true
      APPLE_DEVELOPMENT_P12_PASSWORD:
        required: true
      APPLE_DISTRIBUTION_P12:
        required: true
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  testflight:
    # macos-26 and not macos-15: Compose links against UIKit classes that only exist from the
    # iOS 26 SDK on, so an older image fails the archive with undefined symbols.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The "Compile Kotlin Framework" run script phase shells out to ./gradlew, so the JDK has to
      # be on PATH before xcodebuild starts, not inside it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v5

      # Both identities come from secrets, for two different reasons. Without the development one,
      # -allowProvisioningUpdates mints a new certificate on every run of a fresh runner until the
      # team hits Apple's cap. Without the distribution one, Xcode signs the export in the cloud:
      # it hands codesign the designated requirement as an argument with the certificate name in
      # it, the é of the team name gets decomposed on the way (NFD), and App Store Connect rejects
      # a requirement that no longer matches the certificate (ITMS-90035).
      - name: Import the signing identities
        env:
          DEV_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          DEV_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          import_p12() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$2" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/identity.p12"
          }
          import_p12 "$DEV_P12" "$DEV_P12_PASSWORD"
          import_p12 "$DIST_P12" "$DIST_P12_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Added in front of the search list, not replacing it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Archive and upload
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail

          # The API key lets -allowProvisioningUpdates create and download the provisioning
          # profiles itself, so no .mobileprovision ever has to live in a secret.
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID"
          )

          # The same version and build number as the Play release of this tag, so the two stores
          # cannot drift apart. Matches both `versionCode = 15` and `const val versionCode = 15`.
          VERSION_NAME=$(sed -n -E 's/.*versionName *= *"([^"]+)".*/\1/p' "$VERSION_FILE" | head -1)
          VERSION_CODE=$(sed -n -E 's/.*versionCode *= *([0-9]+).*/\1/p' "$VERSION_FILE" | head -1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No versionName or versionCode in $VERSION_FILE"
            exit 1
          fi
          echo "::notice::Uploading $VERSION_NAME ($VERSION_CODE)"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            "${AUTH[@]}" \
            TEAM_ID="$TEAM_ID" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE"

          # `destination: upload` hands the build straight to App Store Connect, which saves
          # exporting an ipa only to feed it to another tool.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"

      - name: Shred the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/identity.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
