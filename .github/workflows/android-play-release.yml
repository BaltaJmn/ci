name: Android release to Play

# Workflow reutilizable: no se dispara solo, lo llama el repositorio de cada app.
# Aqui vive lo que costo depurar una vez y no merece la pena reescribir por app:
# restaurar la clave, comprobar que el paquete sale firmado con ella y borrarla
# antes de que corra la accion de terceros.
on:
  workflow_call:
    inputs:
      package-name:
        description: applicationId en Play
        type: string
        required: true
      signer-cn:
        description: Texto que tiene que aparecer en el certificado del paquete
        type: string
        default: CN=Baltasar
      java-version:
        type: string
        default: '17'
      gradle-tasks:
        description: Tareas de Gradle que dejan el .aab construido
        type: string
        default: ':androidApp:bundleRelease'
      aab-path:
        type: string
        default: androidApp/build/outputs/bundle/release/androidApp-release.aab
      track:
        description: Canal de Play. alpha es prueba cerrada, la que tiene testers de verdad.
        type: string
        default: alpha
      whatsnew-dir:
        description: Carpeta con un fichero whatsnew-<locale> por idioma. Vacio para no mandar notas.
        type: string
        default: ''
      status:
        description: |
          Estado de la version en Play. draft mientras la app no tenga ninguna version publicada:
          Play rechaza cualquier otro estado en una app en borrador.
        type: string
        default: completed
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      BUILD_ENV:
        description: |
          Variables que el build de la app necesita, una KEY=VALUE por linea.
          Va como secreto y no como entrada porque las entradas salen en claro en el log.
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Lo unico que el job necesita de GitHub es leer el codigo. Explicito para no depender de
    # como este configurado el repositorio que llama.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v4

      # Dos mecanismos de firma conviviendo a proposito: hay apps que leen
      # keystore.properties y otras que leen el entorno. Escribir las dos cosas
      # cuesta cuatro lineas y evita tocar el Gradle de cada app.
      # Si falta el secreto el build no rompe, firma con la clave de debug y sube
      # basura, asi que se falla aqui y en voz alta.
      # Las contrasenas van en el env de este paso y del de construir, no del job:
      # la accion de terceros que publica corre en el mismo job y no tiene por que
      # verlas.
      - name: Restaurar la clave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 is empty"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          cat > keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_ALIAS_PASSWORD
          EOF

      # Las entradas pasan por el entorno y no interpoladas dentro del script.
      # Este workflow es publico y lo puede llamar cualquiera: interpolar texto
      # ajeno en un `run:` seria inyeccion de shell, aunque solo se hiciera dano
      # a si mismo. Sin comillas a proposito, para que las tareas se separen.
      # Las variables de la app (BUILD_ENV, una KEY=VALUE por linea) se exportan
      # aqui dentro y no por GITHUB_ENV, por lo mismo que las contrasenas: solo
      # Gradle las necesita. add-mask antes de exportar, porque estos logs son
      # publicos; una declarada pero vacia se salta, enmascarar la cadena vacia
      # taparia el log entero.
      - name: Construir
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
          KEYSTORE_PATH: upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            [ -n "${line#*=}" ] || continue
            echo "::add-mask::${line#*=}"
            export "$line"
          done <<< "${BUILD_ENV:-}"
          ./gradlew $GRADLE_TASKS

      # Firmado con la clave de subida y no con la de debug. Comprobarlo es barato
      # y el fallo que atrapa es de los que Play solo cuenta despues de subir.
      - name: Verificar la firma
        env:
          AAB_PATH: ${{ inputs.aab-path }}
          SIGNER_CN: ${{ inputs.signer-cn }}
        run: |
          set -euo pipefail
          # A fichero y no por tuberia a grep: grep -q sale pronto, jarsigner recibe
          # SIGPIPE y pipefail convertiria una comprobacion correcta en un build roto.
          # -verbose:summary y no -certs a secas: sin verbose, jarsigner imprime "jar
          # verified" y ni una linea de certificado, asi que el grep no encuentra nada.
          jarsigner -verify -verbose:summary -certs "$AAB_PATH" > signature.txt
          grep -qF "$SIGNER_CN" signature.txt \
            || { echo "::error::bundle is not signed with the upload key"; exit 1; }

      # Antes de la accion de terceros, no despues. Esa accion recibe el mismo
      # directorio de trabajo y no tiene ninguna razon para encontrarse la clave.
      - name: Borrar la clave
        run: rm -f upload.jks keystore.properties

      # Fijada a un commit y no a la etiqueta movil v1: recibe la cuenta de servicio
      # que publica, con permisos de cuenta sobre todas las apps. Para actualizar,
      # el SHA de la version nueva y su etiqueta en el comentario.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: ${{ inputs.aab-path }}
          # tracks y no track: el singular esta deprecado en la accion y avisa en cada ejecucion.
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: ${{ inputs.whatsnew-dir }}

      - name: Asegurar que la clave no queda ni fallando
        if: always()
        run: rm -f upload.jks keystore.properties
